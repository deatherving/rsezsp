version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # tokio-serial is pinned exactly on purpose: it is the layer that touches a
    # tty, where a wrong default is an uninterruptible hang rather than an
    # error. Bumping it is a deliberate act with a hardware run behind it, not
    # something to merge on a green CI badge.
    ignore:
      - dependency-name: tokio-serial

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # `dtolnay/rust-toolchain@1.90` pins the *Rust toolchain*, not the
      # action. Dependabot reads it as a version tag and bumps it, which
      # quietly turns the minimum-supported-Rust job into a second stable
      # build -- it keeps passing while proving nothing. The MSRV moves when
      # `rust-version` in Cargo.toml moves, deliberately, not on a schedule.
      - dependency-name: dtolnay/rust-toolchain
