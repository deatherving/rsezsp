name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to full commit SHAs, not to tags.
#
# A tag is a movable pointer. `@v4` fetches whatever that name points at when
# the job runs, and executes it with access to the checkout and the job token
# -- so if an action's repository or a maintainer's account is compromised and
# the tag is repointed, the next run here executes the attacker's code with no
# change on our side, no diff and no notification. That is not hypothetical;
# it is how the tj-actions/changed-files compromise reached thousands of
# repositories in 2025.
#
# A commit SHA is content-addressed and cannot be repointed. The trailing
# comment keeps it readable, and Dependabot understands the format, so updates
# still arrive as ordinary pull requests.
#
# This does not protect against a malicious *new* version that we then merge.
# It protects against a version we already trust changing underneath us.

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned; toolchain chosen below
        with: { toolchain: "stable", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The codecs are sans-I/O. Building without the runtime is what keeps
      # that true rather than aspirational.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  package:
    name: packages for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned; toolchain chosen below
        with: { toolchain: "stable" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Builds the crate from only the files that would actually be published
      # and compiles it there. Catches the classic first-publish failure: an
      # `exclude` entry that removes something the build needs, which no local
      # test can see because the file is still on disk.
      - run: cargo package --all-features

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned; toolchain chosen below
        with: { toolchain: "1.90" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-features

  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Stable, like every other job. `cargo fuzz` defaults to
      # AddressSanitizer, which needs `-Z sanitizer` and therefore nightly;
      # `--sanitizer none` drops it and builds on stable. That costs very
      # little here: this crate is pure Rust and forbids `unsafe`, so memory
      # safety is already the compiler's guarantee and ASan has almost nothing
      # to find. What the fuzzer is hunting is panics and hangs on malformed
      # input -- which the lints forbid outright -- and libFuzzer finds those
      # either way.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned; toolchain chosen below
        with: { toolchain: "stable" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-fuzz
      # Compile-only, plus a short smoke run. A target that stops building is
      # a regression worth failing on; a long campaign is a separate,
      # deliberate activity and does not belong on every push.
      - run: cargo fuzz build --sanitizer none
      - run: cargo fuzz run ash_frame_decode --sanitizer none -- -max_total_time=30
      - run: cargo fuzz run ezsp_frame_decode --sanitizer none -- -max_total_time=30
      - run: cargo fuzz run ezsp_types_decode --sanitizer none -- -max_total_time=30
      - run: cargo fuzz run ezsp_callback_decode --sanitizer none -- -max_total_time=30
