[package]
name = "rsezsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A Rust implementation of Silicon Labs EZSP for Ember NCP devices"
license = "MIT"
repository = "https://github.com/deatherving/rsezsp"
homepage = "https://github.com/deatherving/rsezsp"
documentation = "https://docs.rs/rsezsp"
authors = ["Li Zhou <ervingzhou@gmail.com>"]
keywords = ["zigbee", "ezsp", "ember", "silabs", "ash"]
categories = ["embedded", "network-programming", "hardware-support"]
readme = "README.md"
exclude = ["/.github", "/scripts"]

# docs.rs builds with default features only unless told otherwise, which would
# hide the entire runtime layer -- `Ncp` is behind `tokio-transport`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `fuzz` is its own crate: it depends on libfuzzer-sys and builds with
# instrumentation flags that have no business in the library's own build. It
# builds on stable, like everything else here.
[workspace]
exclude = ["fuzz"]

[features]
default = ["tokio-transport"]
# The async runtime layer. The codecs are sans-I/O and available without it,
# which is what makes them testable and fuzzable with no runtime at all.
tokio-transport = ["dep:tokio", "dep:tokio-serial"]

[dependencies]
thiserror = "2"
tracing = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
    "macros",
    "io-util",
], optional = true }
# Pinned exactly. This is the layer that touches a tty, where a wrong default
# is a ten-minute uninterruptible hang rather than an error (see
# transport::serial), so a silent minor bump is not something to accept.
tokio-serial = { version = "=5.5.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "startup"
required-features = ["tokio-transport"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every byte this crate parses came off a serial line from a device it does not
# control. A malformed frame must be a typed error, never a panic, so the lints
# that let one in are warnings the build denies rather than suggestions.
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
